name: Sync Dashboard Data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch data
        run: |
          mkdir -p api_data
          
          # Fetch Weather from Open-Meteo
          curl -s -f -o api_data/weather.json "https://api.open-meteo.com/v1/forecast?latitude=-30.0346&longitude=-51.2177&current=temperature_2m,relative_humidity_2m,weather_code" || echo "{}" > api_data/weather.json
          
          # Fetch Trade Alerts from ntfy.sh (fetch the last 10 messages without polling to avoid hanging)
          curl -s -f -o api_data/alerts.json "https://ntfy.sh/guido_crypto_dashboard_alerts_99x/json?poll=1&since=12h" || echo "{}" > api_data/alerts.json
          
          # Combine into one file
          echo "{\"weather\": $(cat api_data/weather.json), \"alerts\": [$(cat api_data/alerts.json | paste -sd, -)]}" > data.json
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Update dashboard data [skip ci]" || echo "No changes to commit"
          git push
