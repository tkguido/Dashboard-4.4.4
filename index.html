<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Dashboard (Legacy Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=47">
</head>
<body>
    
    <!-- Night Mode Clock Overlay -->
    <div id="night-mode-overlay" class="hidden">
        <h1 id="night-time">00:00</h1>
    </div>

    <!-- Weekend Mode Overlay -->
    <div id="weekend-mode-overlay" class="hidden">
        <div class="weekend-cell">
            <h1 id="wk-time">00:00</h1>
            <p id="wk-date">Carregando data...</p>
            <div class="wk-weather">
                <span id="wk-temp">--°C</span> &nbsp;|&nbsp; <span id="wk-hum">--%</span>
            </div>
            <div class="wk-btc">
                BITCOIN <span id="wk-btc-price">--</span>
            </div>
        </div>
    </div>

    <!-- Efeito Comemorativo (Hora Redonda) -->
    <div id="celebration-overlay" class="hidden"></div>

    <!-- Barras de Progresso de Tempo (Dia/Ano) -->
    <div id="progress-container">
        <div class="progress-track"><div id="day-progress" class="progress-fill day-fill"></div></div>
        <div class="progress-track"><div id="year-progress" class="progress-fill year-fill"></div></div>
    </div>

    <div id="dashboard-wrapper">
        <div class="dashboard-container clearfix">
            <!-- Coluna da Esquerda (25%) -->
            <div class="col-left">
                <!-- Relógio e Data -->
                <div class="card glass clock-card">
                    <h1 id="time">00:00</h1>
                    <p id="date" class="date-text">Carregando data...</p>
                </div>

                <!-- Finanças (Moedas e Criptos) -->
                <div class="card glass finance-card">
                    <div class="finance-grid" id="finance-container">
                        <div class="finance-item">
                            <span class="label">BITCOIN</span>
                            <h2 id="btc-price">Carregando...</h2>
                            <span id="btc-var" class="var-label"></span>
                        </div>
                        <div class="finance-item">
                            <span class="label">DÓLAR</span>
                            <h2 id="usd-price">Carregando...</h2>
                            <span id="usd-var" class="var-label"></span>
                        </div>
                        <div class="finance-item">
                            <span class="label">ETHEREUM</span>
                            <h2 id="eth-price">Carregando...</h2>
                            <span id="eth-var" class="var-label"></span>
                        </div>
                        <div class="finance-item">
                            <span class="label">EURO</span>
                            <h2 id="eur-price">Carregando...</h2>
                            <span id="eur-var" class="var-label"></span>
                        </div>
                    </div>
                    <p class="subtext" style="margin-top: 1rem; font-size: 0.75rem;" id="finance-status">Atualizando cotações...</p>
                </div>

                <!-- Calendários -->
                <div class="card glass calendar-card">
                    <div id="calendars-container" class="calendars-grid">
                        <!-- Preenchido via JS -->
                    </div>
                </div>
            </div>

            <!-- Coluna da Direita (75%) -->
            <div class="col-right">
                <!-- Top Bar: Clima + Notícias (Compatível com Android 4.4 usando display: table) -->
                <div class="card glass top-bar-card" style="display: table; width: 100%; padding: 15px; box-sizing: border-box; height: 130px; margin-bottom: 20px;">
                    <!-- Lado Esquerdo: Clima -->
                    <div class="weather-section" style="display: table-cell; width: 28%; vertical-align: middle; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 20px; text-align: center;">
                        <div>
                            <h2 id="temperature" style="font-size: 2.2rem; margin: 0; display: inline-block; vertical-align: middle;">--°C</h2>
                            <h2 id="humidity" style="font-size: 1.8rem; margin: 0 0 0 10px; color: #0ea5e9; display: inline-block; vertical-align: middle;">--%</h2>
                        </div>
                        <p id="location-status" class="subtext" style="margin-top: 5px; font-size: 0.75rem; margin-bottom: 0;">Aguardando...</p>
                    </div>

                    <!-- Lado Direito: Notícias G1/CNN -->
                    <div class="news-section" style="display: table-cell; width: 72%; vertical-align: middle; padding-left: 20px; overflow: hidden;">
                        <div id="news-ticker" style="font-size: 1.15rem; color: #f8fafc; font-weight: 500; width: 100%; white-space: normal; line-height: 1.4; max-height: 3.2rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                            Carregando manchetes do G1 e CNN Brasil...
                        </div>
                        <span id="news-status" style="display: none;">Buscando...</span>
                    </div>
                </div>

                <!-- YouTube Player (Rádio Musical / Hub) -->
                <div class="card glass player-card">
                    <div class="yt-controls" style="display: flex; gap: 20px; align-items: center; justify-content: space-between;">
                        <select id="yt-preset" onchange="loadPresetYouTube()" style="width: 100%; max-width: 300px; flex-shrink: 0;">
                            <optgroup label="🎶 Música (Ao Vivo)">
                                <option value="jfKfPfyJRdk">🎵 Lofi Girl (Foco/Estudos)</option>
                                <option value="9UMxZofMNbA">🎵 Chillout Lounge</option>
                                <option value="tL-t6mULgLU">🎵 Summer Pop Mix</option>
                                <option value="WnCfvAMM9eY" selected>🎵 Rádio 70s & 80s</option>
                                <option value="_wYENnYaboM">🎵 Rádio Hits 90s</option>
                                <option value="9hylBusqpX8">🎵 Retro 80s & 90s</option>
                            </optgroup>
                            <optgroup label="📺 Notícias">
                                <option value="SKPAGlK05vM">📺 Record News (BR)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="iframe-container">
                        <iframe id="yt-iframe" width="100%" height="100%" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&controls=1" title="YouTube Media Center" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 12px;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js?v=47"></script>
</body>
</html>
